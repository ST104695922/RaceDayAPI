name: RaceDayAPI CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore "RaceDayAPI/RaceDayAPI.sln"
      - name: Build
        run: dotnet build "RaceDayAPI/RaceDayAPI.sln" --configuration Release --no-restore
      - name: Test
        run: dotnet test "RaceDayAPI/RaceDayAPI.sln" --configuration Release --no-build --logger "trx;LogFileName=test-results.trx"
